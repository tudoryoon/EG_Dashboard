name: Recheck MSCI ACWI Close

on:
  workflow_dispatch:
  schedule:
    # 09:15, 09:30 and 10:00 KST, Tuesday through Saturday.
    - cron: "15,30 0 * * 2-6"
    - cron: "0 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: msci-acwi-close
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pandas yfinance requests curl_cffi lxml html5lib beautifulsoup4
      - run: python scripts/test_msci_acwi_ntr.py
      - name: Refresh the index and publish only on top of current main
        run: |
          set -e
          files=(data/market-price-data.js data/market-rs-data.js data/market-trend-score-data.js)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git switch --detach origin/main
            python scripts/msci_acwi_ntr.py --if-stale
            if git diff --quiet -- "${files[@]}"; then
              exit 0
            fi
            mapfile -t changed < <(git diff --name-only -- "${files[@]}")
            python scripts/bump_data_cache_versions.py "${changed[@]}"
            git add -- "${changed[@]}" index.html
            git commit -m "Refresh MSCI ACWI NTR index"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
