name: Update Study CDS

on:
  push:
    branches:
      - main
    paths:
      - scripts/update_study_cds.py
      - scripts/update_study_crwv_bond.py
      - scripts/update_study_credit_batch.py
      - scripts/test_study_crwv_bond.py
      - scripts/test_study_crwv_bond_view.cjs
      - .github/workflows/update-study-cds.yml
  workflow_dispatch:
    inputs:
      backfill:
        description: Refresh the full one-year DTCC history
        required: false
        default: false
        type: boolean
  schedule:
    # 00:40 UTC = 09:40 KST, after DTCC's usual next-day 00:15 UTC file publication.
    - cron: "40 0 * * 2-6"

permissions:
  contents: write

concurrency:
  group: update-study-cds
  cancel-in-progress: false

jobs:
  update-study-cds:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node for data validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test bond collection and presentation
        run: |
          python scripts/test_study_crwv_bond.py
          node scripts/test_study_crwv_bond_view.cjs

      - name: Refresh CDS and bond independently
        id: collect
        shell: bash
        run: |
          if [[ "${{ inputs.backfill }}" == "true" ]]; then
            python scripts/update_study_credit_batch.py --backfill
          else
            python scripts/update_study_credit_batch.py
          fi

      - name: Publish successful CDS and bond datasets
        if: steps.collect.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.collect.outputs.changed_files }}
        run: |
          read -r -a files <<< "$CHANGED_FILES"
          python scripts/bump_data_cache_versions.py "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}" index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update CDS and unsecured bond data"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin main; then
              conflicts=$(git diff --name-only --diff-filter=U)
              if [[ "$conflicts" != "index.html" ]]; then
                echo "::error::Data conflict requires review; refusing to overwrite newer data."
                exit 1
              fi
              git show :2:index.html > index.html
              python scripts/bump_data_cache_versions.py "${files[@]}"
              git add index.html
              GIT_EDITOR=true git rebase --continue
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Report failures after publishing successful datasets
        if: always() && steps.collect.outputs.failed_count != '' && steps.collect.outputs.failed_count != '0'
        run: |
          echo "::error::Some collectors failed; previous data preserved. See collection summary."
          exit 1
