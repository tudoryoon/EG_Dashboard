name: Update Market Briefing Morning

on:
  workflow_dispatch:
  schedule:
    # 19:43 UTC = 04:43 KST. Early run, expecting GitHub schedule queues to delay execution.
    - cron: "43 19 * * *"
    # 19:58 UTC = 04:58 KST.
    - cron: "58 19 * * *"
    # 20:13 UTC = 05:13 KST.
    - cron: "13 20 * * *"
    # 20:28 UTC = 05:28 KST.
    - cron: "28 20 * * *"

permissions:
  contents: write

jobs:
  update-market-briefing-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests

      - name: Refresh market prices and briefing
        run: |
          python scripts/update_market_prices.py
          python scripts/update_market_briefing.py

      - name: Commit updated market briefing
        run: |
          if git diff --quiet -- data/market-briefing-data.js data/market-price-data.js; then
            echo "No market briefing or market price changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-briefing-data.js data/market-price-data.js
          git commit -m "Update market briefing and market prices" || exit 0
          git pull --rebase origin main
          git push
