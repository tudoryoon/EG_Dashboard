name: Update Market Critical Morning

on:
  workflow_dispatch:
  schedule:
    # 20:25 UTC = 05:25 KST. Primary run for the pre-07:00 Korea morning dashboard.
    - cron: "25 20 * * *"
    # 21:15 UTC = 06:15 KST. Backup run in case GitHub schedule queues are delayed.
    - cron: "15 21 * * *"

permissions:
  contents: write

jobs:
  update-market-critical-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests lxml html5lib openpyxl xlrd

      - name: Refresh market briefing
        run: python scripts/update_market_briefing.py

      - name: Commit updated market briefing
        run: |
          if git diff --quiet -- data/market-briefing-data.js; then
            echo "No market briefing changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-briefing-data.js
          git commit -m "Update market briefing" || exit 0
          git pull --rebase origin main
          git push

      - name: Refresh remaining critical market dashboards
        run: |
          python scripts/update_market_prices.py
          python scripts/update_market_vix.py
          python scripts/update_market_breadth.py
          python scripts/update_market_valuation.py

      - name: Commit updated remaining critical market dashboards
        run: |
          if git diff --quiet -- data/market-price-data.js data/market-vix-data.js data/market-breadth-data.js data/market-valuation-data.js; then
            echo "No remaining critical market dashboard changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-price-data.js data/market-vix-data.js data/market-breadth-data.js data/market-valuation-data.js
          git commit -m "Update critical market dashboards" || exit 0
          git pull --rebase origin main
          git push
