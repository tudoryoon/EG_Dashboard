name: Update Market Briefing Morning

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run update and diff checks without committing or pushing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      refresh_if_stale:
        description: "Refresh Daily Briefing and Asset Returns only if they are stale"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dispatch_source:
        description: "Optional dispatcher label for audit visibility"
        required: false
        default: "manual"
        type: string
  schedule:
    # Daily Briefing runs at 06:21 and 06:35 KST (21:21/21:35 UTC).
    - cron: "21 21 * * *"
    - cron: "35 21 * * *"

permissions:
  contents: write

jobs:
  scorecards:
    uses: ./.github/workflows/refresh-market-scorecard.yml
    with:
      dry_run: ${{ inputs.dry_run == 'true' }}

  update-market-briefing-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether backup run is needed
        id: backup-guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from datetime import datetime, time, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          event_name = "${{ github.event_name }}"
          should_run = True
          refresh_assets = True
          reason = "manual run always refreshes data"

          refresh_if_stale = "${{ inputs.refresh_if_stale }}" == "true"
          if event_name == "schedule" or refresh_if_stale:
              text = Path("data/market-briefing-data.js").read_text(encoding="utf-8")
              match = re.search(r"window\.marketBriefingData\s*=\s*(\{.*\});\s*$", text, re.S)
              payload = json.loads(match.group(1)) if match else {}
              current_date = str(payload.get("updatedAt") or "")
              now_new_york = datetime.now(ZoneInfo("America/New_York"))

              try:
                  request = Request(
                      "https://query1.finance.yahoo.com/v8/finance/chart/QQQ"
                      "?range=10d&interval=1d&includePrePost=false&events=history",
                      headers={"User-Agent": "Mozilla/5.0"},
                  )
                  with urlopen(request, timeout=15) as response:
                      chart = json.loads(response.read().decode("utf-8"))
                  result = chart["chart"]["result"][0]
                  available_dates = sorted(
                      datetime.fromtimestamp(value, timezone.utc).date()
                      for value in (result.get("timestamp") or [])
                  )
                  if (
                      now_new_york.weekday() < 5
                      and now_new_york.time() < time(16, 10)
                  ):
                      available_dates = [day for day in available_dates if day < now_new_york.date()]
                  latest_available = available_dates[-1].isoformat() if available_dates else ""
                  try:
                      assets_text = Path("data/study-asset-returns-data.js").read_text(encoding="utf-8")
                      asset_date = json.loads(assets_text.split("=", 1)[1].strip().removesuffix(";")).get("asOfDate") or ""
                  except (OSError, ValueError, IndexError):
                      asset_date = ""
                  refresh_assets = not latest_available or asset_date < latest_available
                  previous_session = available_dates[-2].isoformat() if len(available_dates) >= 2 else ""
                  incomplete = sorted({
                      str(item.get("ticker"))
                      for sector in payload.get("sectorPanels", [])
                      for item in sector.get("items", [])
                      if not str(item.get("ticker", "")).endswith(".KS")
                      and (
                          item.get("priceDate") != latest_available
                          or item.get("previousCloseDate") != previous_session
                          or item.get("dayChangePct") is None
                      )
                  })
                  incomplete.extend(
                      str(card.get("symbol")) for card in payload.get("indexCards", [])
                      if card.get("updatedAt") != latest_available
                      or card.get("previousCloseDate") != previous_session
                      or card.get("returns", {}).get("1d") is None
                  )
                  if len(payload.get("indexCards", [])) != 6:
                      incomplete.append("index cards missing")

                  if current_date and latest_available and current_date >= latest_available and not incomplete:
                      should_run = False
                      reason = (
                          f"Daily Briefing is current ({current_date}); "
                          f"latest completed QQQ session is {latest_available}"
                      )
                  else:
                      reason = (
                          f"Daily Briefing {current_date or 'missing'} needs refresh against "
                          f"completed session {latest_available or 'unknown'}; "
                          f"incomplete daily returns: {', '.join(incomplete[:10]) or 'none'}"
                      )
              except Exception as error:
                  if now_new_york.weekday() < 5 and now_new_york.time() < time(16, 10):
                      should_run = False
                      refresh_assets = False
                      reason = f"QQQ session check failed before market close; retry later: {error}"
                  else:
                      reason = f"QQQ session check failed after market close; running guarded update: {error}"

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"refresh_assets={'true' if refresh_assets else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Report backup guard
        run: echo "${{ steps.backup-guard.outputs.reason }}"

      - name: Set up Python
        if: steps.backup-guard.outputs.should_run == 'true' || steps.backup-guard.outputs.refresh_assets == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.backup-guard.outputs.should_run == 'true' || steps.backup-guard.outputs.refresh_assets == 'true'
        run: python -m pip install pandas pandas_market_calendars yfinance requests curl_cffi beautifulsoup4 tzdata

      - name: Refresh market prices and briefing
        if: steps.backup-guard.outputs.should_run == 'true'
        run: |
          python scripts/test_briefing_price_sessions.py
          python scripts/test_index_price_history.py
          python scripts/test_msci_acwi_ntr.py
          python scripts/update_market_prices.py
          python scripts/update_market_briefing.py

      - name: Refresh asset returns
        if: steps.backup-guard.outputs.refresh_assets == 'true'
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python scripts/test_asset_returns.py
          python scripts/update_asset_returns.py

      - name: Commit updated morning data
        if: (steps.backup-guard.outputs.should_run == 'true' || steps.backup-guard.outputs.refresh_assets == 'true') && inputs.dry_run != 'true'
        env:
          REFRESH_BRIEFING: ${{ steps.backup-guard.outputs.should_run }}
          REFRESH_ASSETS: ${{ steps.backup-guard.outputs.refresh_assets }}
        run: |
          files=(data/market-briefing-data.js data/market-price-data.js data/study-asset-returns-data.js)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_briefing() {
            mapfile -t changed < <(git diff --name-only -- "${files[@]}")
            if (( ${#changed[@]} == 0 )); then
              echo "No morning data changes detected."
              return 1
            fi
            python scripts/bump_data_cache_versions.py "${changed[@]}"
            git add -- "${changed[@]}" index.html
            git commit -m "Update morning market data" || return 1
            return 0
          }

          if ! commit_briefing; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed. Rebuilding Daily Briefing on top of origin/main."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            if [[ "$REFRESH_BRIEFING" == "true" ]]; then
              python scripts/update_market_prices.py
              python scripts/update_market_briefing.py
            fi
            if [[ "$REFRESH_ASSETS" == "true" ]]; then
              timeout 120s python scripts/update_asset_returns.py || echo "::warning::Asset returns refresh failed; preserving the previous snapshot."
            fi
            if ! commit_briefing; then
              exit 0
            fi
          done

          echo "Failed to push Daily Briefing after 3 attempts."
          exit 1

      - name: Report dry run diff
        if: (steps.backup-guard.outputs.should_run == 'true' || steps.backup-guard.outputs.refresh_assets == 'true') && inputs.dry_run == 'true'
        run: |
          echo "Dry run enabled. Skipping commit and push."
          git diff --stat -- data/market-briefing-data.js data/market-price-data.js data/study-asset-returns-data.js
