name: Update Market Briefing Morning

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run update and diff checks without committing or pushing"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    # Daily Briefing primary run and retry runs.
    # 18:58/19:18 UTC = 03:58/04:18 KST early runs.
    # 19:47 UTC = 04:47 KST primary run.
    # 20:21/20:35 UTC = 05:21/05:35 KST retry runs.
    - cron: "58 18 * * *"
    - cron: "18 19 * * *"
    - cron: "47 19 * * *"
    - cron: "21 20 * * *"
    - cron: "35 20 * * *"

permissions:
  contents: write

jobs:
  update-market-briefing-morning:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether backup run is needed
        id: backup-guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from datetime import datetime, time, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          event_name = "${{ github.event_name }}"
          should_run = True
          reason = "manual run always refreshes data"

          if event_name == "schedule":
              text = Path("data/market-briefing-data.js").read_text(encoding="utf-8")
              match = re.search(r"window\.marketBriefingData\s*=\s*(\{.*\});\s*$", text, re.S)
              payload = json.loads(match.group(1)) if match else {}
              current_date = str(payload.get("updatedAt") or "")
              now_new_york = datetime.now(ZoneInfo("America/New_York"))

              try:
                  request = Request(
                      "https://query1.finance.yahoo.com/v8/finance/chart/QQQ"
                      "?range=10d&interval=1d&includePrePost=false&events=history",
                      headers={"User-Agent": "Mozilla/5.0"},
                  )
                  with urlopen(request, timeout=15) as response:
                      chart = json.loads(response.read().decode("utf-8"))
                  result = chart["chart"]["result"][0]
                  available_dates = sorted(
                      datetime.fromtimestamp(value, timezone.utc).date()
                      for value in (result.get("timestamp") or [])
                  )
                  if (
                      now_new_york.weekday() < 5
                      and now_new_york.time() < time(16, 10)
                  ):
                      available_dates = [day for day in available_dates if day < now_new_york.date()]
                  latest_available = available_dates[-1].isoformat() if available_dates else ""

                  if current_date and latest_available and current_date >= latest_available:
                      should_run = False
                      reason = (
                          f"Daily Briefing is current ({current_date}); "
                          f"latest completed QQQ session is {latest_available}"
                      )
                  else:
                      reason = (
                          f"Daily Briefing {current_date or 'missing'} trails "
                          f"latest completed QQQ session {latest_available or 'unknown'}"
                      )
              except Exception as error:
                  if now_new_york.weekday() < 5 and now_new_york.time() < time(16, 10):
                      should_run = False
                      reason = f"QQQ session check failed before market close; retry later: {error}"
                  else:
                      reason = f"QQQ session check failed after market close; running guarded update: {error}"

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Report backup guard
        run: echo "${{ steps.backup-guard.outputs.reason }}"

      - name: Set up Python
        if: steps.backup-guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.backup-guard.outputs.should_run == 'true'
        run: python -m pip install pandas yfinance requests

      - name: Refresh market prices and briefing
        if: steps.backup-guard.outputs.should_run == 'true'
        run: |
          python scripts/update_market_prices.py
          python scripts/update_market_briefing.py

      - name: Commit updated market briefing
        if: steps.backup-guard.outputs.should_run == 'true' && inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_briefing() {
            if git diff --quiet -- data/market-briefing-data.js data/market-price-data.js; then
              echo "No market briefing or market price changes detected."
              return 1
            fi
            python scripts/bump_data_cache_versions.py data/market-briefing-data.js data/market-price-data.js
            git add data/market-briefing-data.js data/market-price-data.js index.html
            git commit -m "Update market briefing and prices" || return 1
            return 0
          }

          if ! commit_briefing; then
            exit 0
          fi

          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed. Rebuilding Daily Briefing on top of origin/main."
            git rebase --abort || true
            git fetch origin main
            git reset --hard origin/main
            python scripts/update_market_prices.py
            python scripts/update_market_briefing.py
            if ! commit_briefing; then
              exit 0
            fi
          done

          echo "Failed to push Daily Briefing after 3 attempts."
          exit 1

      - name: Report dry run diff
        if: steps.backup-guard.outputs.should_run == 'true' && inputs.dry_run == 'true'
        run: |
          echo "Dry run enabled. Skipping commit and push."
          if git diff --quiet -- data/market-briefing-data.js data/market-price-data.js; then
            echo "No market briefing or market price changes detected."
            exit 0
          fi
          git diff --stat -- data/market-briefing-data.js data/market-price-data.js
