name: Update AI Data and Research Calendar

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC = 11:00 KST. Check AI data, calendar and public ARR daily.
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency:
  group: ai-data-and-calendar
  cancel-in-progress: false

jobs:
  update-openrouter-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node for data validation
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Test ARR parsing and isolated collection
        run: |
          python -m unittest discover -s scripts -p test_llm_arr_update.py
          node scripts/test_llm_reported_arr.cjs

      - name: Refresh each dataset independently
        id: collect
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python scripts/update_ai_data_batch.py

      - name: Commit updated AI data and calendar
        if: steps.collect.outputs.changed_files != ''
        env:
          CHANGED_FILES: ${{ steps.collect.outputs.changed_files }}
        run: |
          read -r -a files <<< "$CHANGED_FILES"
          python scripts/bump_data_cache_versions.py "${files[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${files[@]}" index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update AI data, public ARR and research calendar"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 5
          done
          exit 1

      - name: Report collection failures after publishing successes
        if: always() && steps.collect.outputs.failed_count != '' && steps.collect.outputs.failed_count != '0'
        run: |
          echo "::error::Some collectors failed. Successful datasets were sent to the publish step; see its result and the collection summary."
          exit 1
