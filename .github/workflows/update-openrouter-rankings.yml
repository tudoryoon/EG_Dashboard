name: Update AI Data Rankings and Prices

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC = 11:00 KST. OpenRouter updates daily; LTPI changes weekly after validation.
    - cron: "0 2 * * *"

permissions:
  contents: write

jobs:
  update-openrouter-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh OpenRouter rankings
        run: python scripts/update_openrouter_rankings.py

      - name: Refresh LLM token price index
        run: python scripts/update_token_price_index.py

      - name: Commit updated AI data
        run: |
          if git diff --quiet -- data/openrouter-rankings-data.js data/token-price-index-data.js; then
            echo "No AI data changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/openrouter-rankings-data.js data/token-price-index-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openrouter-rankings-data.js data/token-price-index-data.js index.html
          git commit -m "Update AI rankings and token prices" || exit 0
          git pull --rebase origin main
          git push
