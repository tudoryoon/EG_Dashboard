name: Update OpenRouter Rankings

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC Tuesday = 11:00 KST Tuesday. Run after OpenRouter weekly rankings refresh.
    - cron: "0 2 * * 2"

permissions:
  contents: write

jobs:
  update-openrouter-rankings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install requests

      - name: Refresh OpenRouter rankings
        run: python scripts/update_openrouter_rankings.py

      - name: Commit updated OpenRouter rankings
        run: |
          if git diff --quiet -- data/openrouter-rankings-data.js; then
            echo "No OpenRouter rankings changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/openrouter-rankings-data.js
          git commit -m "Update OpenRouter rankings" || exit 0
          git pull --rebase origin main
          git push
