name: Refresh Market RS Full History

on:
  workflow_dispatch:
  schedule:
    # Sunday 05:30 UTC = Sunday 14:30 KST. Full 5Y source validation.
    - cron: "30 5 * * 0"

permissions:
  contents: write

concurrency:
  group: update-market-rs
  cancel-in-progress: false

jobs:
  refresh-full-rs-history:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests lxml html5lib beautifulsoup4

      - name: Refresh full market RS source history
        env:
          MARKET_RS_PRICE_PERIOD: "5y"
          MARKET_RS_MAX_SHARES_FETCH: "1600"
          MARKET_RS_BATCH_SIZE: "30"
          MARKET_RS_BATCH_WORKERS: "3"
        run: python scripts/update_market_rs.py

      - name: Refresh full market trend score
        run: python scripts/update_market_trend_score.py

      - name: Validate market RS pipeline outputs
        run: python scripts/validate_market_rs_pipeline.py

      - name: Commit full market RS history
        run: |
          if git diff --quiet -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json; then
            echo "No full market RS changes detected."
            exit 0
          fi
          git stash push -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json
          git pull --rebase origin main
          git stash pop
          python scripts/bump_data_cache_versions.py data/market-rs-data.js data/market-trend-score-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-rs-data.js data/market-trend-score-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json index.html
          git commit -m "Refresh full market RS history" || exit 0
          git pull --rebase origin main
          git push
