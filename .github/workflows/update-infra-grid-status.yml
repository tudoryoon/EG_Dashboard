name: Update Infra Grid Status

on:
  workflow_dispatch:
  schedule:
    # 23:47 UTC = 08:47 KST. Non-critical morning follow-up.
    - cron: "47 23 * * *"

permissions:
  contents: write

jobs:
  update-infra-grid-status:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas requests gridstatus

      - name: Refresh infra grid snapshot
        run: python scripts/update_infra_grid_status.py

      - name: Commit updated infra grid snapshot
        run: |
          if git diff --quiet -- data/infra-grid-status-data.js; then
            echo "No infra grid status changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/infra-grid-status-data.js
          git commit -m "Update infra grid status snapshot" || exit 0
          git pull --rebase origin main
          git push
