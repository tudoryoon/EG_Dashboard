name: Update US Market Regime

on:
  workflow_dispatch:
    inputs:
      force:
        description: Recalculate even when the latest completed session is published
        type: boolean
        default: false
  schedule:
    # US Mon-Fri = KST Tue-Sat. UTC 20:05 = KST 05:05 next day.
    - cron: "5 20 * * 1-5"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-market-regime
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # In winter 05:05 KST is before the NY close. Wait for close + 5 min.
    timeout-minutes: 110
    env:
      PYTHONUNBUFFERED: "1"
      EVENT_NAME: ${{ github.event_name }}
      FORCE_REFRESH: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/market-regime-requirements.txt
      - name: Install pinned dependencies
        run: python -m pip install -r scripts/market-regime-requirements.txt
      - name: Restore independent OHLCV cache
        uses: actions/cache/restore@v4
        with:
          path: .market-regime-cache/prices.json.gz
          key: market-regime-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: market-regime-v1-${{ runner.os }}-
      - name: Test trading calendar and calculation boundaries
        run: python -m unittest discover -s scripts -p test_market_regime_daily.py
      - name: Refresh US indicators after the completed NYSE session
        run: |
          args=()
          if [ "$EVENT_NAME" = "schedule" ]; then args+=(--scheduled --wait); fi
          if [ "$FORCE_REFRESH" = "true" ]; then args+=(--force); fi
          python scripts/update_market_regime.py "${args[@]}"
          python scripts/test_market_regime_artifact.py
      - name: Preserve cache for incremental collection and retries
        if: ${{ !cancelled() && hashFiles('.market-regime-cache/prices.json.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: .market-regime-cache/prices.json.gz
          key: market-regime-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Publish only market-regime assets
        id: publish
        run: |
          files=(study/market-regime/snapshot.js study/market-regime/provenance.json study/market-regime/index.html)
          if git diff --quiet -- "${files[@]}"; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'No new US session to publish.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'Update US market regime scorecard'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          exit 1
      - name: Rebuild Pages after a data publication
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
      - name: Summarize current data
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path('study/market-regime/provenance.json').read_text())
          u = p['markets']['us']
          print('### US Market Regime')
          print(f"Published data date: {u['asOf']}; universe: {u['universeCount']}")
          print('KST Tue-Sat 05:05; NYSE holidays skipped. KR/CN are frozen snapshots.')
          PY
