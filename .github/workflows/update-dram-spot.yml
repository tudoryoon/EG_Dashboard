name: Update DRAM Spot

on:
  workflow_dispatch:
    inputs:
      dispatch_source:
        description: Dispatch source
        type: string
        default: manual
  schedule:
    # 03:17 UTC = 12:17 KST. Cloudflare follow-up is 12:28 KST.
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: memory-data-update
  cancel-in-progress: false

jobs:
  update-dram-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parser
        run: python -m pip install beautifulsoup4
      - name: Test DRAM source and history rules
        run: python -m unittest discover -s scripts -p test_memory_spot.py
      - name: Refresh DRAM chip history and today's direct quote
        run: python scripts/update_memory_spot.py --scope dram
      - name: Commit updated DRAM spot data
        run: |
          if git diff --quiet -- data/memory-data-history.js; then
            echo "No DRAM spot changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/memory-data-history.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memory-data-history.js index.html
          git commit -m "Update DRAM spot data"
          git pull --rebase origin main
          git push
