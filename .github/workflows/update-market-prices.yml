name: Update Market Prices

on:
  workflow_dispatch:
  schedule:
    # 20:45 UTC = 05:45 KST. Run after the 05:25 briefing-only update.
    - cron: "45 20 * * *"
    # 21:25 UTC = 06:25 KST. Backup run after the 05:03 RS backup.
    - cron: "25 21 * * *"

permissions:
  contents: write

jobs:
  update-market-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests lxml html5lib openpyxl xlrd

      - name: Refresh market price history
        run: |
          python scripts/update_market_prices.py
          python scripts/update_market_vix.py
          python scripts/update_market_breadth.py
          python scripts/update_market_valuation.py

      - name: Commit updated market price history
        run: |
          if git diff --quiet -- data/market-price-data.js data/market-vix-data.js data/market-breadth-data.js data/market-valuation-data.js; then
            echo "No market price, VIX, breadth, or valuation changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/market-price-data.js data/market-vix-data.js data/market-breadth-data.js data/market-valuation-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-price-data.js data/market-vix-data.js data/market-breadth-data.js data/market-valuation-data.js index.html
          git commit -m "Update market price, VIX, breadth, and valuation history" || exit 0
          git pull --rebase origin main
          git push
