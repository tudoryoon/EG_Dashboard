name: Update Market RS

on:
  workflow_dispatch:
  schedule:
    # 20:55 UTC = 05:55 KST. Separate RS run after the lighter 05:25 critical dashboards.
    - cron: "55 20 * * *"
    # 21:35 UTC = 06:35 KST. Backup run before the Korea 07:00 morning window.
    - cron: "35 21 * * *"

permissions:
  contents: write

jobs:
  update-market-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests lxml html5lib beautifulsoup4

      - name: Refresh market RS history
        env:
          MARKET_RS_MAX_SHARES_FETCH: "1600"
          MARKET_RS_FINANCIALS_MAX_COMPANIES: "35"
          MARKET_RS_FINANCIALS_STALE_DAYS: "14"
        run: |
          python scripts/update_market_rs.py
          python scripts/update_market_trend_score.py
          python scripts/update_market_rs_financials.py

      - name: Commit updated market RS history
        run: |
          if git diff --quiet -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js; then
            echo "No market RS changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js index.html
          git commit -m "Update market RS history" || exit 0
          git pull --rebase origin main
          git push
