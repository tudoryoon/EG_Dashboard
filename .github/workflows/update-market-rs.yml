name: Update Market RS

on:
  workflow_dispatch:
    inputs:
      refresh_if_stale:
        description: "Exit without refreshing when RS data already has the latest completed session"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dispatch_source:
        description: "Optional dispatcher label for audit visibility"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/update_market_rs.py"
      - "data/market-rs-manual-tickers.json"
  schedule:
    # 19:27 UTC = 04:27 KST. Main RS / Trend Score run.
    - cron: "27 19 * * *"
    # 20:03 UTC = 05:03 KST. Backup RS / Trend Score run.
    - cron: "03 20 * * *"

permissions:
  contents: write

concurrency:
  group: update-market-rs
  cancel-in-progress: false

jobs:
  update-market-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check whether refresh is needed
        id: refresh-guard
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          from datetime import datetime, time, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          event_name = "${{ github.event_name }}"
          refresh_if_stale = "${{ inputs.refresh_if_stale }}" == "true"
          should_run = True
          reason = "manual run always refreshes data"

          if event_name == "schedule" or refresh_if_stale:
              text = Path("data/market-rs-data.js").read_text(encoding="utf-8")
              match = re.search(r"window\.marketRsData\s*=\s*(\{.*\});\s*$", text, re.S)
              payload = json.loads(match.group(1)) if match else {}
              current_date = str(payload.get("updatedAt") or "")
              now_new_york = datetime.now(ZoneInfo("America/New_York"))

              try:
                  request = Request(
                      "https://query1.finance.yahoo.com/v8/finance/chart/QQQ"
                      "?range=10d&interval=1d&includePrePost=false&events=history",
                      headers={"User-Agent": "Mozilla/5.0"},
                  )
                  with urlopen(request, timeout=15) as response:
                      chart = json.loads(response.read().decode("utf-8"))
                  result = chart["chart"]["result"][0]
                  available_dates = sorted(
                      datetime.fromtimestamp(value, timezone.utc).date()
                      for value in (result.get("timestamp") or [])
                  )
                  if now_new_york.weekday() < 5 and now_new_york.time() < time(16, 10):
                      available_dates = [day for day in available_dates if day < now_new_york.date()]
                  latest_available = available_dates[-1].isoformat() if available_dates else ""

                  if current_date and latest_available and current_date >= latest_available:
                      should_run = False
                      reason = f"RS data is current ({current_date}); latest completed QQQ session is {latest_available}"
                  else:
                      reason = f"RS data {current_date or 'missing'} trails latest completed QQQ session {latest_available or 'unknown'}"
              except Exception as error:
                  if now_new_york.weekday() < 5 and now_new_york.time() < time(16, 10):
                      should_run = False
                      reason = f"QQQ session check failed before market close; retry later: {error}"
                  else:
                      reason = f"QQQ session check failed after market close; running guarded update: {error}"

          print(f"should_run={'true' if should_run else 'false'}")
          print(f"reason={reason}")
          PY

      - name: Report refresh guard
        run: echo "${{ steps.refresh-guard.outputs.reason }}"

      - name: Set up Python
        if: steps.refresh-guard.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.refresh-guard.outputs.should_run == 'true'
        run: python -m pip install pandas yfinance requests lxml html5lib beautifulsoup4

      # Keep every RS universe current each trading day. The script fetches only
      # the latest five sessions and merges them into the saved three-year history.
      - name: Refresh full daily market RS universe
        if: steps.refresh-guard.outputs.should_run == 'true'
        env:
          # Price/RS needs every ticker daily; shares only change materially
          # around splits and are fully revalidated by the Sunday 5Y job.
          MARKET_RS_MAX_SHARES_FETCH: "50"
          MARKET_RS_BATCH_SIZE: "30"
          MARKET_RS_BATCH_WORKERS: "3"
        run: python scripts/update_market_rs.py

      - name: Refresh full daily market trend score universe
        if: steps.refresh-guard.outputs.should_run == 'true'
        run: python scripts/update_market_trend_score.py

      - name: Refresh market RS financials
        if: steps.refresh-guard.outputs.should_run == 'true'
        env:
          MARKET_RS_FINANCIALS_MAX_COMPANIES: "35"
          MARKET_RS_FINANCIALS_STALE_DAYS: "14"
        run: python scripts/update_market_rs_financials.py

      - name: Refresh full CANSLIM EPS surprise history
        if: steps.refresh-guard.outputs.should_run == 'true' && (github.event_name == 'workflow_dispatch' || github.event.schedule == '03 20 * * *')
        run: python scripts/update_market_canslim_earnings.py --scope all

      - name: Commit updated market RS history
        if: steps.refresh-guard.outputs.should_run == 'true'
        run: |
          if git diff --quiet -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json; then
            echo "No market RS changes detected."
            exit 0
          fi
          # Refreshes can take a while. Rebase generated files onto the latest
          # main before changing index.html cache keys to avoid cross-job races.
          git stash push -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json
          git pull --rebase origin main
          git stash pop
          python scripts/bump_data_cache_versions.py data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json index.html
          git commit -m "Update market RS history" || exit 0
          git pull --rebase origin main
          git push

      # Validation remains visible in the run, but a recoverable coverage or
      # provider-lag warning must not discard already-generated daily data.
      - name: Validate market RS pipeline outputs
        if: steps.refresh-guard.outputs.should_run == 'true'
        continue-on-error: true
        run: python scripts/validate_market_rs_pipeline.py
