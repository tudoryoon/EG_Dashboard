name: Update Market RS

on:
  workflow_dispatch:
    inputs:
      refresh_if_stale:
        description: "Refresh only datasets missing the latest completed session; check RS, Trend and CANSLIM independently"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      prices_only:
        description: "Refresh RS and Trend prices without unrelated breadth, financials, or earnings collection"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      dispatch_source:
        description: "Optional dispatcher label for audit visibility"
        required: false
        default: "manual"
        type: string
  push:
    branches:
      - main
    paths:
      - "scripts/update_market_rs.py"
      - "data/market-rs-manual-tickers.json"
  schedule:
    # 21:27 UTC = 06:27 KST. Main RS / Trend Score run.
    - cron: "27 21 * * *"
    # 21:45 UTC = 06:45 KST. Backup RS / Trend Score run.
    - cron: "45 21 * * *"

permissions:
  contents: write

concurrency:
  group: update-market-rs
  cancel-in-progress: false

jobs:
  update-market-rs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MARKET_CANSLIM_EARNINGS_EXTRA_TICKERS: "DUOL"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Queued push runs must start from the newest main, including data
          # published by an earlier run in this concurrency group.
          ref: main

      - name: Check whether refresh is needed
        id: refresh-guard
        shell: bash
        env:
          REFRESH_IF_STALE: ${{ inputs.refresh_if_stale }}
          PRICES_ONLY: ${{ inputs.prices_only }}
          FULL_EARNINGS_ALLOWED: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '45 21 * * *' }}
        run: |
          python scripts/test_market_rs_refresh_guard.py
          python scripts/market_rs_refresh_guard.py >> "$GITHUB_OUTPUT"

      - name: Report refresh guard
        run: echo "${{ steps.refresh-guard.outputs.reason }}"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install pandas yfinance requests curl_cffi lxml html5lib beautifulsoup4

      - name: Test Yahoo MSCI collector and history preservation
        run: python scripts/test_msci_acwi_ntr.py

      - name: Catch up delayed MSCI RS and Trend without refreshing the full universe
        if: steps.refresh-guard.outputs.refresh_rs != 'true'
        run: python scripts/msci_acwi_ntr.py --if-stale --rs-only

      # Keep every RS universe current each trading day. The script fetches only
      # the latest five sessions and merges them into the saved three-year history.
      - name: Refresh full daily market RS universe
        if: steps.refresh-guard.outputs.refresh_rs == 'true'
        env:
          # Price/RS needs every ticker daily; shares only change materially
          # around splits and are fully revalidated by the Sunday 5Y job.
          MARKET_RS_MAX_SHARES_FETCH: "50"
          MARKET_RS_BATCH_SIZE: "30"
          MARKET_RS_BATCH_WORKERS: "3"
        run: python scripts/update_market_rs.py

      - name: Refresh full daily market trend score universe
        if: steps.refresh-guard.outputs.refresh_trend == 'true'
        run: python scripts/update_market_trend_score.py

      - name: Refresh closing-price new high and low breadth
        if: steps.refresh-guard.outputs.refresh_breadth == 'true'
        continue-on-error: true
        run: python scripts/update_market_breadth.py

      - name: Refresh Daily Briefing reported EPS before financial prioritization
        id: earnings-daily
        if: steps.refresh-guard.outputs.refresh_earnings_daily == 'true'
        continue-on-error: true
        run: python scripts/update_market_canslim_earnings.py --scope daily-briefing

      - name: Refresh market RS financials
        id: financials
        if: steps.refresh-guard.outputs.refresh_financials == 'true'
        continue-on-error: true
        env:
          MARKET_RS_FINANCIALS_MAX_COMPANIES: "35"
          MARKET_RS_FINANCIALS_STALE_DAYS: "14"
          MARKET_RS_FINANCIALS_EXTRA_TICKERS: "DUOL"
        run: |
          python scripts/test_financial_earnings_priority.py
          python scripts/test_financial_statement_overlay.py
          python scripts/update_market_rs_financials.py

      - name: Refresh full CANSLIM EPS surprise history
        id: earnings-all
        if: steps.refresh-guard.outputs.refresh_earnings_all == 'true'
        continue-on-error: true
        run: |
          python scripts/test_canslim_earnings.py
          python scripts/update_market_canslim_earnings.py --scope all

      - name: Commit updated market RS history
        run: |
          if git diff --quiet -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json data/market-breadth-data.js data/market-breadth-warmup.json.gz; then
            echo "No market RS changes detected."
            exit 0
          fi
          # Refreshes can take a while. Rebase generated files onto the latest
          # main before changing index.html cache keys to avoid cross-job races.
          git stash push -- data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json data/market-breadth-data.js data/market-breadth-warmup.json.gz
          git pull --rebase origin main
          git stash pop
          python scripts/bump_data_cache_versions.py data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-breadth-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-rs-data.js data/market-trend-score-data.js data/market-rs-financials-data.js data/market-canslim-earnings-data.js data/market-rs-nasdaq100-snapshot.json data/sec-company-tickers-cache.json data/market-rs-financial-adjustments.json data/market-breadth-data.js data/market-breadth-warmup.json.gz index.html
          git commit -m "Update market RS history" || exit 0
          git pull --rebase origin main
          git push

      # Validation remains visible in the run, but a recoverable coverage or
      # provider-lag warning must not discard already-generated daily data.
      - name: Validate market RS pipeline outputs
        if: steps.refresh-guard.outputs.refresh_rs == 'true' || steps.refresh-guard.outputs.refresh_trend == 'true'
        continue-on-error: true
        run: |
          python scripts/test_rs_maturity_ramp.py
          python scripts/test_rs_manual_cap_exemption.py
          python -m unittest discover -s scripts -p "test_market_breadth.py"
          python scripts/validate_market_rs_pipeline.py

      - name: Report financial collection failures after publishing successful data
        if: always() && (steps.financials.outcome == 'failure' || steps.earnings-daily.outcome == 'failure' || steps.earnings-all.outcome == 'failure')
        run: |
          echo "::error::Some CANSLIM collectors failed. Successful outputs were preserved; the next run checks each dataset independently."
          exit 1
