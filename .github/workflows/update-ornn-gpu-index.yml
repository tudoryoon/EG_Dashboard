name: Update GPU Price Indexes

on:
  workflow_dispatch:
  schedule:
    # 01:37 UTC = 10:37 KST, after gpuhunt's hourly catalog publication.
    - cron: "37 1 * * *"

permissions:
  contents: write

jobs:
  update-gpu-price-indexes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Ornn GPU index history
        run: python scripts/update_ornn_gpu_index.py

      - name: Refresh independent EG GPU Rental Index
        run: python scripts/update_eg_gpu_rental_index.py

      - name: Commit updated GPU index histories
        run: |
          if git diff --quiet -- data/ornn-gpu-index-data.js data/eg-gpu-rental-index-data.js; then
            echo "No GPU index changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/ornn-gpu-index-data.js data/eg-gpu-rental-index-data.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ornn-gpu-index-data.js data/eg-gpu-rental-index-data.js index.html
          git commit -m "Update GPU price index histories" || exit 0
          git pull --rebase origin main
          git push
