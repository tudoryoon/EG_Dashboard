name: Update Market Briefing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install briefing dependencies
        run: python -m pip install pandas pandas_market_calendars yfinance requests curl_cffi beautifulsoup4 tzdata

      - name: Refresh market briefing
        run: |
          python scripts/test_briefing_price_sessions.py
          python scripts/test_index_price_history.py
          python -m unittest discover -s scripts -p "test_fedwatch_data.py"
          python scripts/update_market_briefing.py

      - name: Refresh asset returns
        timeout-minutes: 3
        continue-on-error: true
        run: |
          python scripts/test_asset_returns.py
          python scripts/update_asset_returns.py

      - name: Commit updated briefing and asset returns
        run: |
          mapfile -t changed < <(git diff --name-only -- data/market-briefing-data.js data/study-asset-returns-data.js)
          if (( ${#changed[@]} == 0 )); then
            echo "No briefing or asset returns changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py "${changed[@]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${changed[@]}" index.html
          git commit -m "chore: update market briefing" || exit 0
          git pull --rebase origin main
          git push
