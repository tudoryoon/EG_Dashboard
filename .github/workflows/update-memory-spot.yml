name: Update Memory Data

on:
  workflow_dispatch:
  schedule:
    # 22:50 UTC = 07:50 KST. Non-critical morning follow-up.
    - cron: "50 22 * * *"

permissions:
  contents: write

jobs:
  update-memory-spot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh memory data history
        run: python scripts/update_memory_spot.py

      - name: Commit updated memory data history
        run: |
          if git diff --quiet -- data/memory-data-history.js; then
            echo "No memory data changes detected."
            exit 0
          fi
          python scripts/bump_data_cache_versions.py data/memory-data-history.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/memory-data-history.js index.html
          git commit -m "Update memory data history" || exit 0
          git pull --rebase origin main
          git push
